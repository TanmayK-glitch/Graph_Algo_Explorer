[project]
name = "graph-algo-explorer"
version = "0.1.0"
description = "Graph Algorithms Explorer — a mini-project implementing reusable graph algorithm modules."
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line-too-long (formatter handles it)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
